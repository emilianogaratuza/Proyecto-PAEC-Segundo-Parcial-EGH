
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participacion</title>
    <link rel="stylesheet" href="css/styles.css">

    <style>
    
    :root {
        --bg-header: #002b66;
        --bg-nav: #004d99;
        --bg-main: #f4f4f9;
        --text-white: #ffffff;
        --shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: var(--bg-main);
        color: #333;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    /* encabezado */
    .header {
        position: sticky;
        top: 0;
        z-index: 1000;
        background-color: var(--bg-header);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 40px;
        border-bottom: 2px solid #001a33;
        width: 100%;
    }

    .site-title {
        font-family: 'Georgia', serif;
        font-size: 3rem;
        color: var(--text-white);
        font-style: italic;
        font-weight: normal;
    }

    /* navegacion */
    .navbar {
        background-color: var(--bg-nav);
        padding: 12px 0;
        width: 100%;
    }

    .nav-menu {
        display: flex;
        justify-content: space-around;
        max-width: 900px;
        margin: 0 auto;
        list-style: none;
    }

    .nav-menu li a {
        color: var(--text-white);
        text-decoration: none;
        font-size: 1.2rem;
        padding: 6px 16px;
        border-radius: 4px;
        transition: background-color 0.3s ease;
    }

    .nav-menu li a:hover,
    .nav-menu li a.active {
        background-color: #003366;
        text-decoration: underline;
    }

    .header-logo {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: contain;
        display: block;
        flex-shrink: 0;
    }

    /* pie */
    .footer {
        background-color: #001a33;
        color: #fff;
        text-align: center;
        padding: 15px 40px;
        margin-top: 40px;
        font-size: 1.05rem;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        min-height: 110px;
    }

    .footer-logo {
        width: 80px;
        height: 80px;
        object-fit: contain;
        border-radius: 50%;
        position: absolute;
        right: 40px;
    }

    /* responsivo */
    @media (max-width: 768px) {

        .header {
            flex-direction: column;
            gap: 10px;
            padding: 15px;
        }

        .site-title {
            font-size: 2rem;
            text-align: center;
        }

        .header-logo {
            width: 80px;
            height: 80px;
        }

        .navbar {
            padding: 10px;
        }

        .nav-menu {
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .nav-menu li a {
            font-size: 0.95rem;
            padding: 7px 10px;
        }

        body > br {
            display: none;
        }

        body > h1 {
            font-size: 1.4rem;
            line-height: 1.4;
            margin: 25px 12px 10px;
            text-align: center;
        }

        .footer {
            flex-direction: column;
            gap: 12px;
            padding: 20px 15px;
            font-size: 0.9rem;
            text-align: center;
        }

        .footer p {
            max-width: 100%;
            overflow-wrap: break-word;
        }

        .footer-logo {
            position: static;
            width: 65px;
            height: 65px;
        }
    }

    /* cel2 */
    @media (max-width: 380px) {

        .site-title {
            font-size: 1.7rem;
        }

        .nav-menu li a {
            font-size: 0.85rem;
            padding: 6px 8px;
        }

        body > h1 {
            font-size: 1.25rem;
        }
    }

    </style>
</head>

<body>

    <header class="header">
        <h1 class="site-title">JovenesConscientes</h1>
        <img src="logo.jpg" alt="Logo" class="header-logo">
    </header>

    <nav class="navbar">
        <ul class="nav-menu">
            <li><a href="../index.html">inicio</a></li>
            <li><a href="../informacion/informacion.html">Informacion</a></li>
            <li><a href="../participacion/participacion.html" class="active">Participacion</a></li>
            <li><a href="../contacto/contactanos.html">Contactanos</a></li>
        </ul>
    </nav>

    <br>
    <br>

    <h1 style="text-align: center; color: #004d99;">Participacion</h1>

    <div class="form-wrapper">
        <div class="form-container">
            <h2>¿Por que queremos que participes?</h2>
            <label>Queremos que TU participes para romper la normalizacion del desvelo y el aislamiento. En el mundo estudiantil,
                presumir que "no se durmio por estudiar" se considera un logro; al hacer que participen,
                descubren colectivamente que el insomnio no es una medalla,
                sino un problema compartido que afecta TU rendimiento, TU memoria y TU salud mental.</label>
        </div>
    </div>

    <div class="form-wrapper">
        <div class="form-container">
            <h2>¿En que consiste participar?</h2>
            <label>Consiste en formar parte activa de un intercambio de experiencias y soluciones en el aula.
                No es sentarse a escuchar una clase sobre higiene del sueño, sino que consiste en que el alumno trabaje en equipo para confesar sus habitos de forma anonima,
                clasificar los problemas del grupo en el pizarron y proponer soluciones realistas para los retos de descanso que sufren sus propios compañeros.</label>
        </div>
    </div>

    <div class="form-wrapper">
        <div class="form-container">
            <h2>¿Qué implica participar?</h2>
            <label>Para el CBTano, participar implica tres compromisos clave:</label>
            <br>
            <ul>
                <li><label>Honestidad: Dejar la vergüenza de lado para admitir sus verdaderas rutinas nocturnas (pantallas, cafe, procrastinacion).</label></li>
                <li><label>Empatia: Escuchar las dificultades de los demas sin juzgar y pensar criticamente en soluciones que realmente les sirvan.</label></li>
                <li><label>Co-responsabilidad: Comprometerse activamente a cumplir y respetar el "pacto de descanso" acordado por todo el grupo.</label></li>
            </ul>
        </div>
    </div>

    <div class="form-wrapper">
        <div class="form-container">
            <h2>Como participar</h2>
            <label>Primero, haz click en el apartado "Contacto" al extremo derecho de el encabezado.
                <br>
                <br>
                Despues, llena el formulario con tus datos. Al llegar a "Motivo del contacto", clickea el la opcion que dice "Peticion para unirse"
                <br>
                <br>
                Ya por ultimo, escribenos un pqeueño mensaje de tu preferencia, y da click al boton de enviar.
            </label>
        </div>
    </div>

    <footer class="footer">
        <p>2026 Eduardo Arzola, Emiliano Garatuza, Alfredo Amarillas / PAEC</p>
        <img src="logo2.jpg" alt="Logo PAEC" class="footer-logo">
    </footer>

</html>
